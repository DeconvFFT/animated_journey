<g fill="#fff" text-anchor="middle" font-weight="bold"><text x="960" y="420" font-size="64">FILL-CROP CARD</text><text x="960" y="500" font-size="40">Read the first number you can still see at the top and at the bottom.</text><text x="960" y="560" font-size="40">That is the share of picture height (%) this player crops.</text><text x="960" y="640" font-size="34" fill="#ffd34d">Yellow numbers along the top and bottom edges: the share of picture width (%).</text><text x="960" y="720" font-size="30">Try: the gallery, WhatsApp, VLC, Google Photos, the TV app. Landscape, then tap or pinch to fill.</text></g>
