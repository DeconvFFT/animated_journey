<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="100 50 400 300" width="400" height="300">
  <style>.glow { fill: #ffd54a } #sun { stroke: #c77700; stroke-width: 3 }</style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(20 .5 .5)">
      <stop offset="0" stop-color="#7ec8ff"/><stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <clipPath id="frame"><rect x="110" y="60" width="380" height="280" rx="12"/></clipPath>
    <mask id="fade"><rect x="100" y="50" width="400" height="300" fill="url(#sky)"/></mask>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="tint"><feColorMatrix type="saturate" values="0.2"/></filter>
    <symbol id="leaf" viewBox="0 0 20 20"><path d="M2 18 Q2 2 18 2 Q18 18 2 18Z" fill="#3c8d40"/></symbol>
  </defs>
  <g id="scene" clip-path="url(#frame)">
    <rect id="bg" x="100" y="50" width="400" height="300" fill="url(#sky)"/>
    <g id="sun-group" data-pivot="300,120" data-z="2">
      <circle id="sun" class="glow" cx="300" cy="120" r="40"/>
      <circle id="sun-halo" cx="300" cy="120" r="60" fill="#ffd54a" opacity=".3" filter="url(#soft)"/>
    </g>
    <g id="tree" data-pivot="200,300">
      <rect id="trunk" x="195" y="240" width="10" height="60" fill="#6b4a2b"/>
      <use id="leaf-1" xlink:href="#leaf" x="170" y="200" width="40" height="40"/>
      <use id="leaf-2" xlink:href="#leaf" x="200" y="205" width="40" height="40"/>
    </g>
    <text id="caption" x="120" y="330" font-family="Georgia, serif" font-size="22" fill="#222">Summer, 1989</text>
    <rect id="faded" x="100" y="50" width="400" height="300" fill="#a0522d" mask="url(#fade)" filter="url(#tint)"/>
  </g>
</svg>
