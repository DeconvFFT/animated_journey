<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LJ flat scene</title>
<meta name="viewport" content="width=1920">
<!--
  A flat SVG scene for the speed marks (SP2 a, e, f): a few filled shapes moving on closed-form paths, no text, no fonts, no filters, no
  network. seekTo(t) is a pure function of t. Style-neutral geometry only (build plan 4.10). ?alpha=1 drops the background for --alpha.
-->
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #20242c; }
  html.alpha, html.alpha body { background: transparent; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <rect id="bg" width="1920" height="1080" fill="#20242c"/>
  <rect x="0" y="760" width="1920" height="320" fill="#2c323d"/>
  <circle id="c1" r="90" fill="#e3b341" cx="0" cy="0"/>
  <rect id="r1" x="-120" y="-120" width="240" height="240" fill="#4aa3a2"/>
  <polygon id="t1" points="0,-110 95,70 -95,70" fill="#c8553d"/>
  <path id="p1" d="M 0 0 C 200 -180 400 180 600 0" stroke="#e9ebef" stroke-width="8" fill="none"/>
  <rect id="b1" y="880" width="120" height="40" fill="#8b93a3"/>
</svg>
<script>
(function () {
  'use strict';
  if (new URLSearchParams(location.search).get('alpha') === '1') { document.documentElement.classList.add('alpha'); document.getElementById('bg').remove(); }
  var g = function (id) { return document.getElementById(id); };
  window.seekTo = function (t) {
    g('c1').setAttribute('transform', 'translate(' + (960 + 520 * Math.cos(t * 1.3)) + ' ' + (380 + 200 * Math.sin(t * 1.3)) + ')');
    g('r1').setAttribute('transform', 'translate(' + (400 + 60 * Math.sin(t * 0.7)) + ' 520) rotate(' + (t * 30) + ')');
    g('t1').setAttribute('transform', 'translate(1500 ' + (560 + 120 * Math.sin(t * 2)) + ') rotate(' + (-t * 45) + ')');
    g('p1').setAttribute('transform', 'translate(660 ' + (780 + 40 * Math.sin(t)) + ')');
    g('b1').setAttribute('x', String((t * 240) % 1800));
    return true;
  };
  window.seekTo(0);
  window.ready = true;
})();
</script>
</body>
</html>
